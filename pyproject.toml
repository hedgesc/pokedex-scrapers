[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pokedex-scrapers"
dynamic = ["version"]
description = "A project containing various Python scripts for scraping pokedex data"
readme = "README.md"
requires-python = ">=3.14.0"
authors = [
    { name = "Cory Hedges", email = "cory.hedges@gmail.com" },
]
dependencies = [
    "beautifulsoup4>=4.15",
    "pydantic-settings>=2.15",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/pokemondb_net_scrapers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
